<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins&display=swap" rel="stylesheet">
</head>

<body>

<!-- 🎵 MUSIC -->
<audio id="bgMusic" loop>
    <source src="assets/music.mp3" type="audio/mp3">
</audio>

<button class="music-btn play" onclick="toggleMusic()">🎵</button>
<button class="music-btn stop" onclick="stopMusic()">⏹</button>

<!-- 💬 WHATSAPP FLOAT -->
<a href="#" onclick="sendDirectWA()" class="wa-float">
    💬
</a>

<!-- ✉️ HERO -->
<section class="hero">
    <div class="envelope" onclick="openEnvelope()">
        <div class="envelope-front">💌</div>
        <div class="envelope-text">Buka Undangan</div>
    </div>
</section>

<!-- 📄 CONTENT -->
<section id="content" class="hidden">

    <!-- 🎬 PARALLAX -->
    <div class="parallax">
        <div class="parallax-text">
            <h1>Jani & Fatihah</h1>
            <p>Forever Begins Here</p>
        </div>
    </div>

    <!-- 📸 GALLERY -->
    <div class="section fade-up">
        <h2>Galeri Kami</h2>
        <div class="gallery">
            <img src="assets/foto1.jpg">
            <img src="assets/foto2.jpg">
            <img src="assets/foto3.jpg">
            <img src="assets/foto4.jpg">
        </div>
    </div>

    <!-- 📍 MAP -->
    <div class="section fade-up">
        <h2>Lokasi Acara</h2>
        <iframe 
            src="https://www.google.com/maps?q=Bali+Beach+Hotel&output=embed" 
            width="100%" 
            height="300"
            style="border:0; border-radius:15px;"
            allowfullscreen="">
        </iframe>
    </div>

    <!-- 🌸 FLOWERS -->
    <div class="flowers"></div>

    <!-- 💑 COUPLE -->
    <div class="section fade-up">
        <h2>Pasangan Mempelai</h2>
        <p><strong>Jani</strong> & <strong>Fatihah</strong></p>
    </div>

    <!-- 📅 EVENT -->
    <div class="section fade-up">
        <h2>Detail Acara</h2>
        <p>Sabtu, 20 April 2026</p>
        <p>Jam 10:00 WIB</p>
        <p>Bali Beach Hotel</p>
    </div>

    <!-- 💌 QUOTE -->
    <div class="section fade-up">
        <p class="quote">"Dan di antara tanda-tanda kebesaran-Nya, Dia menciptakan pasangan hidup..."</p>
    </div>

    <!-- 📲 RSVP WA -->
    <div class="section fade-up">
        <h2>Konfirmasi Kehadiran</h2>

        <input type="text" id="name" placeholder="Nama Anda"><br>

        <button onclick="sendDirectWA()">Kirim via WhatsApp</button>
    </div>

</section>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
